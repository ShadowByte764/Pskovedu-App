name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Auto-structure Android project
        run: |
          mkdir -p app/src/main/java/ru/pskovedu/diary
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/java/ru/pskovedu/diary/ || true
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/ || true
          [ -f strings.xml ] && mv strings.xml app/src/main/res/values/ || true
          [ -f themes.xml ] && mv themes.xml app/src/main/res/values/ || true
          [ -f backup_rules.xml ] && mv backup_rules.xml app/src/main/res/xml/ || true
          [ -f data_extraction_rules.xml ] && mv data_extraction_rules.xml app/src/main/res/xml/ || true

          if [ -f build.gradle.kts ]; then
            mv build.gradle.kts app/build.gradle.kts
          fi

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.20" apply false
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

          
